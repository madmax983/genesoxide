[workspace]
resolver = "2"
members = [
    "crates/genesoxide-core",
    "crates/genesoxide-config",
    "crates/genesoxide-desktop",
    "crates/genesoxide-test-harness",
]

[profile.dev.package.genesoxide-core]
opt-level = 2

# Optimize audio-critical dependencies in debug builds
[profile.dev.package.ringbuf]
opt-level = 2
[profile.dev.package.cpal]
opt-level = 2
