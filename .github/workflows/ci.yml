name: CI

on:
  pull_request:
  push:
    branches: [trunk]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # genesoxide-desktop links against ALSA and libudev; pkg-config locates them.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # note: the repo is not fmt-clean yet, and running `cargo fmt --all` would
      # touch audio-workstream files (ym2612.rs) that are off-limits. Keep this
      # informational (non-blocking) until the codebase is formatted, then remove
      # continue-on-error to make it a hard gate.
      - name: Format check
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --verbose

      # note: the codebase is not clippy-clean yet (warnings in genesoxide-core,
      # genesoxide-desktop, and genesoxide-test-harness), so we do NOT pass
      # `-- -D warnings`. Add it once the outstanding lints are resolved.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test genesoxide-core
        run: cargo test -p genesoxide-core

      - name: Test genesoxide-config
        run: cargo test -p genesoxide-config

      # The z80_suite test skips gracefully when the SingleStepTests dataset is
      # absent, and the ymfm reference harness builds vendored C++ via cc (the
      # ubuntu-latest runner ships a C++ toolchain, so no extra install needed).
      - name: Test genesoxide-test-harness
        run: cargo test -p genesoxide-test-harness
